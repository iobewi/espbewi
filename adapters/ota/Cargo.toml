[package]
name = "espbewi-ota"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP partition and NOR-flash adapter for FiBeWI ArtifactStorage"
keywords = ["esp32", "ota", "flash", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = [
  "esp-bootloader-esp-idf/esp32c3",
  "espbewi-partitions/esp32c3",
  "espbewi-flash?/esp32c3",
]
esp32s3 = [
  "esp-bootloader-esp-idf/esp32s3",
  "espbewi-partitions/esp32s3",
  "espbewi-flash?/esp32s3",
]
shared-flash = ["dep:espbewi-flash"]

[dependencies]
fibewi = { git = "https://github.com/iobewi/fibewi", rev = "dd6a7a93d00c9c56cf8b12af1f5ea92f4957e9ad", default-features = false, features = ["engine", "boot"] }
embedded-storage = "0.3.1"
esp-bootloader-esp-idf = { version = "=0.5.0", default-features = false }
espbewi-partitions = { path = "../../hardware/partitions", default-features = false }
espbewi-flash = { path = "../../hardware/flash", default-features = false, optional = true }
