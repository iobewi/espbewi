[package]
name = "espbewi-config-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP NVS adapter for config-space-manager"
keywords = ["esp32", "configuration", "nvs", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = [
  "espbewi-flash/esp32c3",
  "espbewi-nvs/esp32c3",
]
esp32s3 = [
  "espbewi-flash/esp32s3",
  "espbewi-nvs/esp32s3",
]

[dependencies]
config-space-manager = { git = "https://github.com/iobewi/config-space-manager", rev = "1d4e02ae8d42cb51867a074bc9a54f78894ecf49" }
espbewi-flash = { path = "../../hardware/flash" }
espbewi-nvs = { path = "../../hardware/nvs" }
esp-nvs = "0.5.0"
log = { version = "0.4.29", default-features = false }
