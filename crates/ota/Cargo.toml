[package]
name = "espbewi-ota"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP partition and NOR-flash adapter for FiBeWI ArtifactStorage"
keywords = ["esp32", "ota", "flash", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = [
  "esp-bootloader-esp-idf/esp32c3",
  "espbewi-partitions/esp32c3",
]
esp32s3 = [
  "esp-bootloader-esp-idf/esp32s3",
  "espbewi-partitions/esp32s3",
]

[dependencies]
fibewi = { git = "https://github.com/iobewi/fibewi", rev = "2386ab200a741c0155821b629e20e7528d4aa30e" }
embedded-storage = "0.3.1"
esp-bootloader-esp-idf = { version = "=0.5.0", default-features = false }
espbewi-partitions = { path = "../partitions", default-features = false }
